<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardengotchi - Smart Garden IoT</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

        :root {
            --header-green: #a7d94b;
            --card-blue: rgba(208, 240, 255, 0.9);
            --card-green: rgba(230, 255, 153, 0.9);
            --card-orange: rgba(255, 217, 161, 0.9);
            --card-pink: rgba(255, 204, 204, 0.9);
            --text-dark: #4a5d23;
            --accent-pink: #f06292;
            --terminal-bg: rgba(11, 26, 17, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20190222/ourmid/pngtree-painted-fresh-flower-meadow-park-background-backgroundadvertising-backgroundbackground-materialbackground-image_49354.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Logo & Header */
        .brand-container {
            width: 100%;
            max-width: 1000px;
            background: var(--header-green);
            padding: 20px;
            text-align: center;
            border-radius: 40px 40px 10px 10px;
            border: 4px solid #8cb83a;
            margin-bottom: 20px;
            box-shadow: 0 8px 0 #769b31;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .main-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: white;
            padding: 10px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .brand-container h1 {
            font-size: 2.8em;
            color: #d81b60;
            text-shadow: 3px 3px 0px #fff;
            letter-spacing: -1px;
            line-height: 1;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 30px;
            border: 3px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h2 { font-size: 1.1em; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; color: var(--accent-pink); }

        input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border: 2px solid #ddd; border-radius: 15px; font-family: inherit;
        }

        button {
            cursor: pointer; border: none; padding: 12px; 
            border-radius: 20px; font-weight: 700; transition: 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-orange { background: #ffab40; color: white; box-shadow: 0 4px 0 #e69138; width: 100%; }
        .btn-pink { background: #f06292; color: white; box-shadow: 0 4px 0 #d81b60; width: 100%; }
        .btn-gray { background: #ccc; color: #666; box-shadow: 0 4px 0 #999; width: 100%; }

        .mode-banner {
            grid-column: span 2;
            background: rgba(197, 225, 165, 0.9);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 3px solid #9ccc65;
        }

        .btn-mode { padding: 8px 20px; border-radius: 20px; border: 2px solid transparent; }
        .btn-mode.active { background: #558b2f; color: white; }
        .btn-mode.inactive { background: white; color: #558b2f; border-color: #558b2f; }

        .sensor-grid {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
        }

        .sensor-card {
            padding: 20px;
            border-radius: 40px;
            border: 3px solid rgba(255,255,255,0.6);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        .blue-card { background: var(--card-blue); border-bottom-left-radius: 100px; }
        .green-card { background: var(--card-green); border-top-right-radius: 100px; }
        .orange-card { background: var(--card-orange); border-radius: 50px; text-align: center; }
        .pink-card { background: var(--card-pink); border-radius: 60px; text-align: center; }

        .sensor-val { font-size: 2.2em; font-weight: 800; background: white; padding: 5px 20px; border-radius: 15px; display: inline-block; margin: 10px 0; }

        .relay-btn {
            background: #f06292; color: white; width: 70px; height: 35px; 
            border-radius: 20px; font-weight: bold; box-shadow: 0 4px 0 #d81b60;
        }

        .chart-section {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-container { background: rgba(255, 255, 255, 0.85); border-radius: 25px; padding: 15px; height: 220px; }

        .terminal {
            grid-column: span 2;
            background: var(--terminal-bg);
            border-radius: 25px;
            padding: 15px;
            color: #4caf50;
            font-family: 'Courier New', monospace;
            border: 5px solid #1b2e22;
        }
        .log-panel { height: 120px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column-reverse; }

        @media (max-width: 768px) { 
            .container, .sensor-grid, .chart-section { grid-template-columns: 1fr; } 
            .brand-container h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <img src="https://play-lh.googleusercontent.com/97yXf8pE-jR_f8I2M0L-V9R5J0I-M8e8I-o6-3J0-o6-3J0-o6-3J0-o6-3J0" alt="IDN Logo" class="main-logo" onerror="this.src='https://idn.sch.id/wp-content/uploads/2021/04/Logo-IDN-Square.png'">
        <div>
            <h1>GARDEN GOTCHI</h1>
            <p style="font-weight: 700; color: #558b2f;">IDN Boarding School - Smart Garden</p>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <h2><i class="fas fa-cloud"></i> Firebase Sync</h2>
            <input type="password" id="fb-apiKey" placeholder="API Key">
            <input type="text" id="fb-dbUrl" placeholder="Database URL">
            <button class="btn-orange" id="btn-connect-fb"><i class="fas fa-link"></i> Connect Firebase</button>
        </div>

        <div class="section">
            <h2 style="color:#d81b60"><i class="fab fa-bluetooth"></i> Micro:bit BLE</h2>
            <button class="btn-pink" id="btn-connect-ble" style="margin-bottom: 10px;"><i class="fab fa-bluetooth"></i> Connect Micro:bit</button>
            <button class="btn-gray" id="btn-disconnect-ble" disabled>X Disconnect</button>
        </div>

        <div class="mode-banner">
            <div>
                <strong>🤖 System Mode: <span id="mode-label">OTOMATIS</span></strong>
            </div>
            <div style="display:flex; gap: 10px;">
                <button id="btn-auto" class="btn-mode active">Otomatis</button>
                <button id="btn-manual" class="btn-mode inactive">Manual</button>
            </div>
        </div>

        <div class="sensor-grid">
            <div class="sensor-card blue-card">
                <strong>Jarak Utama 💧</strong>
                <div class="sensor-val" id="val-jarak">0<small>cm</small></div>
                <p style="font-size: 0.7em;">Pompa nyala jika jarak > 30cm</p>
            </div>

            <div class="sensor-card pink-card">
                <strong>Relay (P13) ⚡</strong><br>
                <button class="relay-btn" id="btn-relay">OFF</button>
            </div>

            <div class="sensor-card green-card">
                <strong>Ember Monitoring 🌊</strong>
                <div class="sensor-val" id="val-jarak2">0<small>cm</small></div>
            </div>

            <div class="sensor-card orange-card">
                <strong>Suhu 🌡️</strong>
                <div class="sensor-val" id="val-suhu">--<small>°C</small></div>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-container"><canvas id="chart-jarak"></canvas></div>
            <div class="chart-container"><canvas id="chart-jarak_manual"></canvas></div>
        </div>

        <div class="terminal">
            <div style="display:flex; justify-content: space-between; font-size: 10px; margin-bottom: 5px; border-bottom: 1px solid #333;">
                <span>system_log@gardengotchi</span>
                <span id="btnClearLog" style="cursor:pointer; color:red;">[CLEAR]</span>
            </div>
            <div id="terminalLog" class="log-panel"></div>
        </div>
    </div>

<script>
// =====================================================================
// LOGIKA ASLI (TIDAK BERUBAH)
// =====================================================================
const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_RX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const UART_TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

let state = {
    device: null,
    rx: null, tx: null,
    isAuto: true,
    history: {
        jarak: { labels: [], data: [] },
        jarak_manual: { labels: [], data: [] }
    },
    charts: {}
};

const $ = id => document.getElementById(id);
const MAX_PTS = 20;

function log(m, color='#4caf50') {
    const t = new Date().toLocaleTimeString();
    $('terminalLog').insertAdjacentHTML('afterbegin', `<div style="color:${color}">[${t}] ${m}</div>`);
}

async function connectBLE() {
    try {
        log("Mencari Micro:bit...", "#ffab40");
        state.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'BBC micro:bit' }],
            optionalServices: [UART_SERVICE_UUID]
        });
        const server = await state.device.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE_UUID);
        state.rx = await service.getCharacteristic(UART_RX_CHAR_UUID);
        state.tx = await service.getCharacteristic(UART_TX_CHAR_UUID);
        
        await state.tx.startNotifications();
        state.tx.addEventListener('characteristicvaluechanged', handleData);
        
        $('btn-connect-ble').disabled = true;
        $('btn-disconnect-ble').disabled = false;
        log("Terhubung ke Micro:bit!", "#a7d94b");
    } catch (e) { log("Error: " + e.message, "red"); }
}

function handleData(event) {
    const val = new TextDecoder().decode(event.target.value).trim();
    if (!val) return;
    val.split(',').forEach(p => {
        const [k, v] = p.split(':');
        if (k === 'J1') { $('val-jarak').innerHTML = `${v}<small>cm</small>`; pushHistory('jarak', v); }
        if (k === 'J2') { $('val-jarak2').innerHTML = `${v}<small>cm</small>`; pushHistory('jarak_manual', v); }
        if (k === 'T')  { $('val-suhu').innerHTML = `${v}<small>°C</small>`; }
    });
}

async function sendCommand(cmd) {
    if (!state.rx) return;
    await state.rx.writeValue(new TextEncoder().encode(cmd + '\n'));
}

function applyMode(isAuto) {
    state.isAuto = isAuto;
    $('btn-auto').className = isAuto ? 'btn-mode active' : 'btn-mode inactive';
    $('btn-manual').className = !isAuto ? 'btn-mode active' : 'btn-mode inactive';
    $('mode-label').innerText = isAuto ? "OTOMATIS" : "MANUAL";
    sendCommand(isAuto ? "MODE:AUTO" : "MODE:MANUAL");
}

$('btn-auto').onclick = () => applyMode(true);
$('btn-manual').onclick = () => applyMode(false);

$('btn-relay').onclick = function() {
    if (state.isAuto) return alert("Ubah ke mode MANUAL dulu!");
    const isOff = this.innerText === "OFF";
    this.innerText = isOff ? "ON" : "OFF";
    this.style.background = isOff ? "#4caf50" : "#f06292";
    sendCommand(isOff ? "RELAY:ON" : "RELAY:OFF");
};

function connectFirebase() {
    const key = $('fb-apiKey').value;
    const url = $('fb-dbUrl').value;
    if (!key || !url) return alert("Isi data Firebase!");
    localStorage.setItem('smarthome_cfg', JSON.stringify({apiKey:key, dbUrl:url}));
    log("Firebase configured.");
}

function initCharts() {
    ['jarak', 'jarak_manual'].forEach(key => {
        const ctx = $(`chart-${key}`).getContext('2d');
        state.charts[key] = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: key.toUpperCase(), data: [], borderColor: key==='jarak'?'#1565c0':'#558b2f', tension: 0.4, fill: true, backgroundColor: 'rgba(255,255,255,0.2)' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    });
}

function pushHistory(key, val) {
    const h = state.history[key];
    h.labels.push(new Date().toLocaleTimeString());
    h.data.push(parseFloat(val));
    if (h.labels.length > MAX_PTS) { h.labels.shift(); h.data.shift(); }
    const ch = state.charts[key];
    if (ch) { ch.data.labels = h.labels; ch.data.datasets[0].data = h.data; ch.update('none'); }
}

window.onload = () => {
    initCharts();
    const saved = JSON.parse(localStorage.getItem('smarthome_cfg') || '{}');
    if (saved.apiKey) { $('fb-apiKey').value = saved.apiKey; $('fb-dbUrl').value = saved.dbUrl; }
};
</script>
</body>
</html>
